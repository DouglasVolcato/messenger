global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # Discover every Docker Compose server replica separately. Until the Go app
  # exposes /metrics these targets will intentionally remain down.
  - job_name: server
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["server"]
        type: A
        port: 8080
        refresh_interval: 5s

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
