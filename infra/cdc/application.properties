# PostgreSQL CDC source
# PostgreSQL is started with wal_level=logical by docker-compose.yml.
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=${POSTGRES_USER:messager}
debezium.source.database.password=${POSTGRES_PASSWORD:messager}
debezium.source.database.dbname=${POSTGRES_DB:messager}
debezium.source.topic.prefix=messager
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=messager_cdc
debezium.source.publication.name=messager_cdc
debezium.source.publication.autocreate.mode=filtered
debezium.source.schema.include.list=public
debezium.source.table.exclude.list=public.migrations
debezium.source.snapshot.mode=initial
debezium.source.tombstones.on.delete=false
debezium.source.slot.drop.on.stop=false
debezium.source.offset.flush.interval.ms=1000

# Store connector offsets in Redis so the CDC reader can resume after restart.
debezium.source.offset.storage=io.debezium.storage.redis.offset.RedisOffsetBackingStore
debezium.source.offset.storage.redis.address=redis:6379

# For this local architecture lab, CDC events are written to Redis Streams.
# RabbitMQ is kept independent for application processing/event queues.
debezium.sink.type=redis
debezium.sink.redis.address=redis:6379
debezium.sink.redis.message.format=extended

quarkus.log.level=INFO
