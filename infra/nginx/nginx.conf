worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Docker's embedded DNS resolver allows Nginx 1.28+ to discover
    # server replicas without hard-coding container IPs.
    upstream server_pool {
        zone server_pool 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 2s;
        least_conn;
        server server:8080 resolve;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_pass http://server_pool;
        }

        # Add a /ws location here when the WebSocket service exists.
        # Keep the WebSocket upstream separate so HTTP and long-lived
        # connections can be scaled independently.
    }

    # Internal endpoint consumed by nginx-prometheus-exporter.
    server {
        listen 8080;
        server_name _;

        location = /stub_status {
            stub_status;
            access_log off;
        }
    }
}
