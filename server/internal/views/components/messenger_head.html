{{ define "messengerHead" }}
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    rel="stylesheet"
    href="/static/assets/tailwind.min.css?v={{ .AppVersion }}"
  />
  <link rel="stylesheet" href="/static/assets/fonts.css?v={{ .AppVersion }}" />
  <script src="/static/assets/htmx.min.js?v={{ .AppVersion }}"></script>
  {{ if .User.ID }}
    <script defer src="/static/assets/realtime-notifications.js?v={{ .AppVersion }}"></script>
  {{ end }}
  <style>
    body {
      font-family: "Nunito Sans", sans-serif;
      background: #faf6f0;
      color: #2e3230;
    }
    h1,
    h2,
    h3 {
      font-family: "Literata", serif;
    }
    .card {
      background: #fff;
      border: 1px solid #e4e0d8;
      border-radius: 16px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      padding: 0.65rem 1rem;
      font-weight: 700;
    }
    .primary {
      background: #4a7c59;
      color: white;
    }
    .soft {
      background: #f0ece4;
    }
    .muted {
      color: #6b6358;
    }
    .input {
      width: 100%;
      border: 1px solid #c4c8bc;
      border-radius: 10px;
      padding: 0.7rem 0.8rem;
      background: white;
    }
    .notification-toasts {
      position: fixed;
      z-index: 1000;
      top: 1rem;
      right: 1rem;
      display: grid;
      width: min(24rem, calc(100vw - 2rem));
      gap: 0.75rem;
    }
    .notification-toast {
      border: 1px solid #c9ddcd;
      border-radius: 14px;
      background: #fff;
      padding: 1rem;
      box-shadow: 0 12px 28px rgba(46, 50, 48, 0.18);
      animation: notification-toast-in 220ms ease-out;
    }
    .notification-toast-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .notification-toast-type {
      color: #3f694b;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .notification-toast-close {
      min-width: 2rem;
      min-height: 2rem;
      border-radius: 8px;
      color: #6b6358;
      font-size: 1.25rem;
      line-height: 1;
    }
    .notification-toast-close:hover,
    .notification-toast-close:focus-visible {
      background: #f0ece4;
      outline: none;
    }
    .notification-toast-link {
      display: inline-flex;
      margin-top: 0.75rem;
      color: #3f694b;
      font-size: 0.875rem;
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 0.2rem;
    }
    @keyframes notification-toast-in {
      from { opacity: 0; transform: translateY(-0.5rem); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-page {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #efeae2;
    }
    .chat-shell {
      display: grid;
      grid-template-columns: 310px minmax(0, 1fr);
      height: 100%;
      min-height: 0;
    }
    .chat-sidebar {
      display: flex;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      border-right: 1px solid #d8d3ca;
      background: #f7f4ef;
    }
    .chat-sidebar-header {
      padding: 1.15rem;
      border-bottom: 1px solid #ded9d0;
      background: #f0ece4;
    }
    .chat-sidebar-body {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      padding: 0.8rem;
    }
    .chat-sidebar-item {
      display: block;
      padding: 0.9rem 1rem;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
    }
    .chat-sidebar-item:hover {
      background: #ebe7df;
    }
    .chat-sidebar-item.active {
      background: #dfe9e1;
    }
    .chat-sidebar-footer {
      border-top: 1px solid #ded9d0;
      padding: 1rem 1.15rem;
      background: #f7f4ef;
    }
    .chat-main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
      height: 100%;
      background: #efeae2;
    }
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 72px;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid #d8d3ca;
      background: rgba(250, 248, 244, 0.96);
    }
    .chat-mobile-back {
      display: none;
    }
    .chat-messages {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 1.25rem clamp(1rem, 3vw, 2.5rem) 1.5rem;
      scroll-behavior: smooth;
      background-image: radial-gradient(rgba(74, 124, 89, 0.055) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .chat-message-row {
      display: flex;
      width: 100%;
      margin: 0.45rem 0;
    }
    .chat-message-row.own {
      justify-content: flex-end;
    }
    .chat-bubble {
      position: relative;
      width: fit-content;
      max-width: min(76%, 720px);
      padding: 0.6rem 0.75rem 0.5rem;
      border: 1px solid #e0ddd7;
      border-radius: 10px 10px 10px 3px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(46, 50, 48, 0.08);
    }
    .chat-message-row.own .chat-bubble {
      border-color: #c9ddcd;
      border-radius: 10px 10px 3px 10px;
      background: #dff0e2;
    }
    .chat-bubble-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 0.25rem;
      font-size: 0.72rem;
      color: #776f66;
    }
    .chat-message-row:not(.own) .chat-bubble-author {
      display: block;
      margin-bottom: 0.2rem;
      font-size: 0.78rem;
      font-weight: 800;
      color: #3f694b;
    }
    .chat-message-row.own .chat-bubble-author {
      display: none;
    }
    .chat-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.55rem;
      margin-top: 0.35rem;
      font-size: 0.72rem;
    }
    .chat-reactions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.35rem;
    }
    .chat-composer {
      padding: 0.75rem 1rem;
      border-top: 1px solid #d8d3ca;
      background: #f7f4ef;
    }
    .chat-composer form {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    .chat-composer .input {
      min-width: 0;
      flex: 1;
      border-radius: 999px;
      padding: 0.8rem 1rem;
    }
    .chat-composer .btn {
      flex: 0 0 auto;
      border-radius: 999px;
      min-width: 82px;
    }
    .chat-alerts {
      position: absolute;
      z-index: 5;
      top: 80px;
      left: 50%;
      width: min(92%, 680px);
      transform: translateX(-50%);
    }

    @media (max-width: 767px) {
      .chat-shell {
        grid-template-columns: 1fr;
      }
      .chat-sidebar {
        display: none;
      }
      .chat-header {
        min-height: 64px;
        padding: 0.7rem 0.85rem;
      }
      .chat-mobile-back {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        border-radius: 999px;
        background: #ece8e1;
      }
      .chat-messages {
        padding: 0.85rem 0.7rem 1rem;
      }
      .chat-bubble {
        max-width: 86%;
      }
      .chat-composer {
        padding: 0.55rem 0.65rem calc(0.55rem + env(safe-area-inset-bottom));
      }
      .chat-composer .btn {
        min-width: 68px;
        padding-left: 0.8rem;
        padding-right: 0.8rem;
      }
      .chat-alerts {
        top: 70px;
      }
    }
  </style>
{{ end }}
