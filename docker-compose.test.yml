# Test override: publishes every service port on the host for local inspection.
# Usage:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.test.yml up --build
#
# The host ports are intentionally different where services use the same
# container port (for example, server and websocket both listen on 8080).
services:
  load-tester:
    build:
      context: load_test
      dockerfile: Dockerfile
    environment:
      TEST_BASE_URL: http://load-balancer
      TEST_WS_URL: ws://load-balancer/ws/notifications
      TEST_METRICS_ADDRESS: :9091
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:-LoadTest123!}
      TEST_USERS_START: ${TEST_USERS_START:-10}
      TEST_USERS_MAX: ${TEST_USERS_MAX:-100}
      TEST_USERS_STEP: ${TEST_USERS_STEP:-10}
      TEST_RPS_START: ${TEST_RPS_START:-5}
      TEST_RPS_MAX: ${TEST_RPS_MAX:-50}
      TEST_RPS_STEP: ${TEST_RPS_STEP:-5}
      TEST_WS_START: ${TEST_WS_START:-5}
      TEST_WS_MAX: ${TEST_WS_MAX:-100}
      TEST_WS_STEP: ${TEST_WS_STEP:-10}
      TEST_PHASE_DURATION: ${TEST_PHASE_DURATION:-30s}
      TEST_MAX_CONCURRENCY: ${TEST_MAX_CONCURRENCY:-256}
    ports:
      - "9091:9091"
    cpus: "1.0"
    mem_limit: 512M
    memswap_limit: 512M
    pids_limit: 256
    depends_on:
      load-balancer:
        condition: service_started
      websocket:
        condition: service_healthy
      publisher-worker:
        condition: service_started
      websocket-worker:
        condition: service_healthy
    restart: "no"
    networks:
      - messenger

  server:
    ports:
      - "8088:8080"

  websocket:
    ports:
      - "8089:8080"

  publisher-worker:
    ports:
      - "9092:9090"

  websocket-worker:
    ports:
      - "9093:9090"

  load-balancer:
    ports:
      - "8080:80"

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3000:3000"

  postgres-exporter:
    ports:
      - "9187:9187"

  redis-exporter:
    ports:
      - "9121:9121"

  nginx-exporter:
    ports:
      - "9113:9113"

  cadvisor:
    ports:
      - "8081:8080"

  node-exporter:
    ports:
      - "9100:9100"
