---
apiVersion: v1
kind: ConfigMap
metadata:
  name: load-balancer-nginx
  namespace: messenger
data:
  nginx.conf: |
    worker_processes auto;

    events {
        worker_connections 4096;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;
        keepalive_timeout 65;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            '' close;
        }

        upstream server_pool {
            least_conn;
            server server:8080;
            keepalive 64;
        }

        upstream websocket_pool {
            least_conn;
            server websocket:8080;
        }

        server {
            listen 80;

            location /ws/ {
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $host;
                proxy_connect_timeout 5s;
                proxy_send_timeout 75s;
                proxy_read_timeout 75s;
                proxy_buffering off;
                proxy_pass http://websocket_pool;
            }

            location / {
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 5s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
                proxy_pass http://server_pool;
            }
        }

        server {
            listen 8080;
            location = /stub_status {
                stub_status;
                access_log off;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-balancer
  namespace: messenger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-balancer
  template:
    metadata:
      labels:
        app: load-balancer
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /stub_status
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
              ephemeral-storage: "256Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: load-balancer-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: load-balancer
  namespace: messenger
spec:
  type: LoadBalancer
  selector:
    app: load-balancer
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: status
      port: 8080
      targetPort: 8080
