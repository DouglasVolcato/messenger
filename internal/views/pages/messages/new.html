<!doctype html>
<html lang="en">
  <head>
    <title>New message - Messenger</title>
    {{ template "messengerHead" . }}
  </head>
  <body class="min-h-screen">
    <main class="max-w-xl mx-auto p-6 pt-10">
      <a class="text-green-800" href="{{ .BackURL }}"
        >← {{ .Workspace.Name }}</a
      >
      <h1 class="text-3xl font-bold mt-2 mb-2">New direct message</h1>
      <p class="muted mb-6">
        Start a conversation with another active member of this workspace.
      </p>
      {{ if .Error }}
        <div class="card p-3 mb-4 border-red-400 text-red-700">
          {{ .Error }}
        </div>
      {{ end }}
      <form
        action="/api/workspaces/{{ .Workspace.ID }}/direct-messages"
        method="post"
        class="card p-6 space-y-4"
      >
        <label class="block"
          >Email or username<input
            class="input mt-1"
            name="identifier"
            required
            autofocus
        /></label>
        <div class="flex justify-end gap-3">
          <a class="btn soft" href="{{ .BackURL }}">Cancel</a
          ><button class="btn primary">Start conversation</button>
        </div>
      </form>
    </main>
  </body>
</html>
