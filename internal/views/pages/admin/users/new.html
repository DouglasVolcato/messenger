<!doctype html>
<html lang="en">
  <head>
    <title>Create user - Messenger Admin</title>
    {{ template "messengerHead" . }}
  </head>
  <body class="min-h-screen">
    <main class="max-w-xl mx-auto p-6 pt-12">
      <a class="text-green-800" href="/admin/users">← Users</a>
      <h1 class="text-3xl font-bold mt-3 mb-6">Create user</h1>
      <form class="card p-6 space-y-4" action="/api/admin/users" method="post">
        <label class="block"
          >Name<input class="input mt-1" name="name" required /></label
        ><label class="block"
          >Username<input class="input mt-1" name="username" required /></label
        ><label class="block"
          >Email<input
            class="input mt-1"
            name="email"
            type="email"
            required /></label
        ><label class="block"
          >Password<input
            class="input mt-1"
            name="password"
            type="password"
            required /></label
        ><label class="block"
          >Status<select class="input mt-1" name="status">
            <option>ACTIVE</option>
            <option>BLOCKED</option>
            <option>DISABLED</option>
          </select></label
        ><label class="flex gap-2 items-center"
          ><input type="checkbox" name="system_admin" /> System
          administrator</label
        ><button class="btn primary">Create user</button>
      </form>
    </main>
  </body>
</html>
