<!doctype html>
<html lang="en">
  <head>
    <title>{{ .User.Name }} - Messenger Admin</title>
    {{ template "messengerHead" . }}
  </head>
  <body class="min-h-screen">
    <main class="max-w-3xl mx-auto p-6 pt-12">
      <a class="text-green-800" href="/admin/users">← Users</a>
      <h1 class="text-3xl font-bold mt-3">{{ .User.Name }}</h1>
      <p class="muted mb-6">@{{ .User.Username }} · {{ .User.Email }}</p>
      <form
        class="card p-6 grid md:grid-cols-2 gap-4"
        action="/api/admin/users/{{ .User.ID }}"
        method="post"
      >
        <label class="block"
          >Name<input
            class="input mt-1"
            name="name"
            value="{{ .User.Name }}"
            required /></label
        ><label class="block"
          >Username<input
            class="input mt-1"
            name="username"
            value="{{ .User.Username }}"
            required /></label
        ><label class="block"
          >Email<input
            class="input mt-1"
            name="email"
            type="email"
            value="{{ .User.Email }}"
            required /></label
        ><label class="block"
          >Status<select class="input mt-1" name="status">
            <option {{ if eq .User.Status "ACTIVE" }}selected{{ end }}>
              ACTIVE
            </option>
            <option {{ if eq .User.Status "BLOCKED" }}selected{{ end }}>
              BLOCKED
            </option>
            <option {{ if eq .User.Status "DISABLED" }}selected{{ end }}>
              DISABLED
            </option>
          </select></label
        ><label class="block md:col-span-2"
          >New password
          <span class="muted text-sm">(leave empty to keep current)</span
          ><input class="input mt-1" name="password" type="password" /></label
        ><label class="flex gap-2 items-center md:col-span-2"
          ><input
            type="checkbox"
            name="system_admin"
            {{ if .User.SystemAdmin }}checked{{ end }}
          />
          System administrator</label
        >
        <div class="md:col-span-2">
          <button class="btn primary">Save user</button>
        </div>
      </form>
      <section class="mt-8">
        <h2 class="text-2xl font-bold mb-4">Companies</h2>
        <div class="card divide-y">
          {{ range .UserCompanies }}
            <div class="p-4 flex justify-between">
              <div>
                <strong>{{ .CompanyName }}</strong>
                <div class="muted text-sm">{{ .Role }}</div>
              </div>
              <a
                class="text-green-800 font-bold"
                href="/admin/companies/{{ .CompanyID }}/members"
                >Manage membership</a
              >
            </div>
          {{ else }}
            <p class="p-6 muted">This user does not belong to any company.</p>
          {{ end }}
        </div>
      </section>
    </main>
  </body>
</html>
