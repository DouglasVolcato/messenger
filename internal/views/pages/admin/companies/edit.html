<!doctype html>
<html lang="en">
  <head>
    <title>{{ .Company.Name }} - Messenger Admin</title>
    {{ template "messengerHead" . }}
  </head>
  <body class="min-h-screen">
    <main class="max-w-2xl mx-auto p-6 pt-12">
      <div class="flex justify-between items-center">
        <a class="text-green-800" href="/admin/companies">← Companies</a
        ><a class="btn soft" href="/admin/companies/{{ .Company.ID }}/members"
          >Members</a
        >
      </div>
      <h1 class="text-3xl font-bold mt-3 mb-6">{{ .Company.Name }}</h1>
      <form
        class="card p-6 space-y-4"
        action="/api/admin/companies/{{ .Company.ID }}"
        method="post"
      >
        <label class="block"
          >Name<input
            class="input mt-1"
            name="name"
            value="{{ .Company.Name }}"
            required /></label
        ><label class="block"
          >Status<select class="input mt-1" name="status">
            <option {{ if eq .Company.Status "ACTIVE" }}selected{{ end }}>
              ACTIVE
            </option>
            <option {{ if eq .Company.Status "SUSPENDED" }}selected{{ end }}>
              SUSPENDED
            </option>
            <option {{ if eq .Company.Status "DISABLED" }}selected{{ end }}>
              DISABLED
            </option>
          </select></label
        ><button class="btn primary">Save</button>
      </form>
    </main>
  </body>
</html>
