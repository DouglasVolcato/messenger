<!doctype html>
<html lang="en">
  <head>
    <title>Create company - Messenger Admin</title>
    {{ template "messengerHead" . }}
  </head>
  <body class="min-h-screen">
    <main class="max-w-xl mx-auto p-6 pt-12">
      <a class="text-green-800" href="/admin/companies">← Companies</a>
      <h1 class="text-3xl font-bold mt-3 mb-6">Create company</h1>
      <form
        class="card p-6 space-y-4"
        action="/api/admin/companies"
        method="post"
      >
        <label class="block"
          >Name<input class="input mt-1" name="name" required /></label
        ><label class="block"
          >Status<select class="input mt-1" name="status">
            <option>ACTIVE</option>
            <option>SUSPENDED</option>
            <option>DISABLED</option>
          </select></label
        ><button class="btn primary">Create company</button>
      </form>
    </main>
  </body>
</html>
