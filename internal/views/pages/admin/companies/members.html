<!doctype html><html lang="en"><head><title>{{.Company.Name}} members - Messenger Admin</title>{{template "messengerHead" .}}</head><body class="min-h-screen"><main class="max-w-5xl mx-auto p-6 pt-10"><div class="flex justify-between items-center mb-6"><div><a class="text-green-800" href="/admin/companies/{{.Company.ID}}/edit">← {{.Company.Name}}</a><h1 class="text-3xl font-bold mt-2">Company members</h1></div><a class="btn soft" href="/admin/users/new">Create user</a></div><form action="/api/admin/companies/{{.Company.ID}}/members" method="post" class="card p-4 grid md:grid-cols-[1fr_180px_auto] gap-3 mb-6"><input class="input" name="identifier" placeholder="Email or username" required><select class="input" name="role"><option>MEMBER</option><option>GUEST</option><option>ADMIN</option><option>OWNER</option></select><button class="btn primary">Add to company</button></form><div class="card divide-y">{{range .Members}}<div class="p-4 grid md:grid-cols-[1fr_180px_260px] gap-4 items-center"><div><strong>{{.Name}}</strong><div class="muted text-sm">@{{.Username}} · {{.Email}} · {{.Status}}</div></div><span>{{.Role}}</span><div class="flex gap-3"><form class="flex gap-2" action="/api/admin/companies/{{$.Company.ID}}/members/{{.UserID}}" method="post"><select class="border rounded px-2" name="role"><option {{if eq .Role "OWNER"}}selected{{end}}>OWNER</option><option {{if eq .Role "ADMIN"}}selected{{end}}>ADMIN</option><option {{if eq .Role "MEMBER"}}selected{{end}}>MEMBER</option><option {{if eq .Role "GUEST"}}selected{{end}}>GUEST</option></select><button class="text-green-800 font-bold">Save</button></form><form action="/api/admin/companies/{{$.Company.ID}}/members/{{.UserID}}/remove" method="post"><button class="text-red-700 font-bold">Remove</button></form></div></div>{{else}}<p class="p-6 muted">No members.</p>{{end}}</div><div class="flex justify-between mt-5 text-sm"><span>{{.Total}} members</span><div class="flex gap-3">{{if .HasPrev}}<a href="?page={{.PrevPage}}">Previous</a>{{end}}<span>Page {{.Page}}</span>{{if .HasNext}}<a href="?page={{.NextPage}}">Next</a>{{end}}</div></div></main></body></html>
