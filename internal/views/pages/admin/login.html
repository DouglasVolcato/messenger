<!doctype html>
<html lang="en">
  <head>
    <title>Admin sign in - Messenger</title>
    {{ template "messengerHead" . }}
  </head>
  <body class="min-h-screen">
    <main class="max-w-md mx-auto p-6 pt-24">
      <section class="card p-8">
        <p class="text-sm font-bold text-green-800">Messenger</p>
        <h1 class="text-3xl font-bold mt-1">System administration</h1>
        <p class="muted mt-2 mb-6">
          Sign in with a system administrator account.
        </p>
        {{ if .Error }}
          <p class="mb-4 rounded-lg bg-red-50 p-3 text-red-700">{{ .Error }}</p>
        {{ end }}
        <form action="/api/admin/login" method="post" class="space-y-4">
          <label class="block"
            >Email or username<input
              class="input mt-1"
              name="identifier"
              value="{{ .Identifier }}"
              required /></label
          ><label class="block"
            >Password<input
              class="input mt-1"
              name="password"
              type="password"
              required /></label
          ><button class="btn primary w-full">Sign in</button>
        </form>
        <p class="mt-5 text-center">
          <a class="text-green-800" href="/login">Normal Messenger login</a>
        </p>
      </section>
    </main>
  </body>
</html>
