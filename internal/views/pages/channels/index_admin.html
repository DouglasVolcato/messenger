<!doctype html><html lang="en"><head><title>Channels - Messenger</title>{{template "messengerHead" .}}</head><body class="min-h-screen"><main class="max-w-5xl mx-auto p-6 pt-10"><div class="flex justify-between items-center mb-6"><div><a class="text-green-800" href="/workspaces/{{.Workspace.ID}}">← {{.Workspace.Name}}</a><h1 class="text-3xl font-bold mt-2">Channels</h1></div><a class="btn primary" href="/workspaces/{{.Workspace.ID}}/channels/new">New channel</a></div><div class="card divide-y">{{range .Channels}}<div class="p-4 flex justify-between gap-4"><div><strong># {{.Name}}</strong><div class="muted text-sm">{{.Type}} · {{.MemberCount}} members</div></div><div class="flex gap-3 text-green-800"><a href="/channels/{{.ID}}/members">Members</a><a href="/channels/{{.ID}}/edit">Edit</a></div></div>{{else}}<p class="p-6 muted">No channels.</p>{{end}}</div><div class="mt-5 flex justify-between text-sm"><span>{{.Total}} channels</span><div class="flex gap-3">{{if .HasPrev}}<a href="?page={{.PrevPage}}">Previous</a>{{end}}<span>Page {{.Page}}</span>{{if .HasNext}}<a href="?page={{.NextPage}}">Next</a>{{end}}</div></div></main></body></html>
