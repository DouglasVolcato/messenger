<!doctype html>
<html lang="en">
  <head>
    <title>Edit channel - Messenger</title>
    {{ template "messengerHead" . }}
  </head>
  <body class="min-h-screen">
    <main class="max-w-xl mx-auto p-6 pt-10">
      <a
        class="text-green-800"
        href="/workspaces/{{ .Channel.WorkspaceID }}/channels"
      >
        ← Channels
      </a>

      <h1 class="text-3xl font-bold mt-2 mb-6">Edit #{{ .Channel.Name }}</h1>

      <form
        action="/api/channels/{{ .Channel.ID }}"
        method="post"
        class="card p-6 space-y-4"
      >
        <label class="block">
          Name
          <input
            class="input mt-1"
            name="channel-name"
            value="{{ .Channel.Name }}"
            required
          />
        </label>

        <label class="block">
          Description
          <textarea class="input mt-1" name="channel-desc">{{ if .Channel.Description }}{{ .Channel.Description }}{{ end }}</textarea>
        </label>

        {{ if eq .Role "OWNER" }}
          <label class="block">
            Visibility
            <select class="input mt-1" name="visibility">
              <option {{ if eq .Channel.Type "PUBLIC" }}selected{{ end }}>
                PUBLIC
              </option>
              <option {{ if eq .Channel.Type "PRIVATE" }}selected{{ end }}>
                PRIVATE
              </option>
            </select>
          </label>
        {{ else }}
          <p class="muted">Visibility: {{ .Channel.Type }}</p>
        {{ end }}

        <div class="flex justify-end">
          <button class="btn primary">Save</button>
        </div>
      </form>
    </main>
  </body>
</html>
