<!doctype html>
<html lang="en">
  <head>
    <title>Channel members - Messenger</title>
    {{ template "messengerHead" . }}
  </head>
  <body class="min-h-screen">
    <main class="max-w-5xl mx-auto p-6 pt-10">
      <div class="flex justify-between mb-6">
        <div>
          <a
            class="text-green-800"
            href="/workspaces/{{ .Channel.WorkspaceID }}?channel={{ .Channel.ID }}"
            >← #{{ .Channel.Name }}</a
          >
          <h1 class="text-3xl font-bold mt-2">Members</h1>
        </div>
        {{ if .CanManage }}
          <a class="btn primary" href="/channels/{{ .Channel.ID }}/members/new"
            >Add member</a
          >
        {{ end }}
      </div>
      <div class="card divide-y">
        {{ range .Members }}
          <div class="p-4 flex justify-between">
            <div>
              <strong>{{ .Name }}</strong>
              <div class="muted text-sm">@{{ .Username }}</div>
            </div>
            <div class="flex gap-4">
              <span>{{ .Role }}</span>{{ if $.CanManage }}
                <a
                  class="text-green-800"
                  href="/channels/{{ $.Channel.ID }}/members/{{ .UserID }}/edit"
                  >Edit</a
                >
              {{ end }}
            </div>
          </div>
        {{ else }}
          <p class="p-6 muted">No members.</p>
        {{ end }}
      </div>
    </main>
  </body>
</html>
