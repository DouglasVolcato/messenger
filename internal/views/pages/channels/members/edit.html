<!doctype html><html lang="en"><head><title>Edit channel member - Messenger</title>{{template "messengerHead" .}}</head><body class="min-h-screen"><main class="max-w-xl mx-auto p-6 pt-10"><a class="text-green-800" href="/channels/{{.Channel.ID}}/members">← Members</a><h1 class="text-3xl font-bold mt-2">{{.Member.Name}}</h1><p class="muted mb-6">@{{.Member.Username}}</p><form action="/api/channels/{{.Channel.ID}}/members/{{.Member.UserID}}" method="post" class="card p-6 space-y-4"><label class="block">Role<select class="input mt-1" name="role"><option {{if eq .Member.Role "MEMBER"}}selected{{end}}>MEMBER</option><option {{if eq .Member.Role "ADMIN"}}selected{{end}}>ADMIN</option><option {{if eq .Member.Role "OWNER"}}selected{{end}}>OWNER</option></select></label><button class="btn primary">Save</button></form>{{if ne .Member.Role "OWNER"}}<form class="mt-4" action="/api/channels/{{.Channel.ID}}/members/{{.Member.UserID}}/remove" method="post"><button class="text-red-700 font-bold">Remove from channel</button></form>{{end}}</main></body></html>
