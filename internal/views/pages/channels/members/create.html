<!doctype html>
<html lang="en">
  <head>
    <title>Add channel member - Messenger</title>
    {{ template "messengerHead" . }}
  </head>
  <body class="min-h-screen">
    <main class="max-w-xl mx-auto p-6 pt-10">
      <a class="text-green-800" href="/channels/{{ .Channel.ID }}/members"
        >← Members</a
      >
      <h1 class="text-3xl font-bold mt-2 mb-6">
        Add member to #{{ .Channel.Name }}
      </h1>
      <form
        action="/api/channels/{{ .Channel.ID }}/members"
        method="post"
        class="card p-6 space-y-4"
      >
        <label class="block"
          >Workspace member<input
            class="input mt-1"
            name="identifier"
            placeholder="Email or username"
            required /></label
        ><label class="block"
          >Role<select class="input mt-1" name="role">
            <option>MEMBER</option>
            <option>ADMIN</option>
          </select></label
        >
        <div class="flex justify-end">
          <button class="btn primary">Add member</button>
        </div>
      </form>
    </main>
  </body>
</html>
