nt-to-t from-surface to-transparent"></div> </div> <div class="p-8 md:p-12 relative z-10 -mt-10"> <div class="mb-10"> <div class="flex items-center gap-3 mb-4"> <div class="w-12 h-12 rounded-xl bg-primary-fixed flex items-center justify-center text-on-primary-fixed-variant shadow-sm"> <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">eco</span> </div> <h1 class="font-headline text-3xl font-bold text-primary tracking-tight">New workspace</h1> </div> <p class="text-on-surface-variant text-lg leading-relaxed max-w-lg"> Create a dedicated organic environment for your team to root their ideas and grow together. </p> </div> <form action="#" class="space-y-8" method="POST"> <div class="space-y-3"> <label class="block font-label text-base font-semibold text-on-surface" for="workspace-name"> Workspace Name </label> <div class="relative group"> <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-on-surface-variant"> <span class="material-symbols-outlined">workspaces</span> </span> <input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border border-transparent rounded-xl text-on-surface font-body text-base placeholder-outline transition-all duration-200 focus:bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 hover:bg-surface-container hover:border-outline-variant outline-none" id="workspace-name" name="workspace-name" placeholder="e.g. Design Team, Marketing Hub" required="" type="text"/> </div> <p class="text-sm text-on-surface-variant ml-1">This is the visible name of your workspace.</p> </div> <div class="space-y-3"> <label class="block font-label text-base font-semibold text-on-surface" for="workspace-slug"> Workspace URL </label> <div class="flex items-center bg-surface-container-low border border-transparent rounded-xl overflow-hidden transition-all duration-200 focus-within:bg-surface focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20 hover:bg-surface-container hover:border-outline-variant"> <div class="pl-4 pr-1 py-4 text-on-surface-variant font-medium select-none flex items-center bg-transparent"> messenger.app/ </div> <input class="flex-1 w-full bg-transparent border-none py-4 pr-4 pl-1 text-on-surface font-body text-base placeholder-outline focus:ring-0 outline-none" id="workspace-slug" name="workspace-slug" placeholder="my-workspace" required="" type="text"/> </div> <p class="text-sm text-on-surface-variant ml-1">You can change this later in settings.</p> </div> <div class="pt-6 border-t border-surface-variant flex flex-col-reverse sm:flex-row justify-end gap-4"> <button class="px-6 py-3.5 rounded-xl font-label font-bold text-primary bg-surface border border-outline-variant hover:bg-surface-variant hover:text-on-primary-fixed-variant transition-colors duration-200 text-center w-full sm:w-auto" type="button"> Cancel </button> <button class="px-8 py-3.5 rounded-xl font-label font-bold bg-primary text-on-primary hover:bg-on-primary-fixed-variant shadow-sm hover:shadow transition-all duration-200 flex items-center justify-center gap-2 w-full sm:w-auto" type="submit"> <span>Create workspace</span> <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'wght' 600;">arrow_forward</span> </button> </div> </form> </div> </div> <div class="text-center mt-8 text-on-surface-variant text-sm font-label"> Need help setting up? <a class="text-primary font-medium hover:underline" href="#">View guides</a> </div> </main> <script> document.addEventListener('DOMContentLoaded', () => { const nameInput = document.getElementById('workspace-name'); const slugInput = document.getElementById('workspace-slug'); let isSlugManuallyEdited = false; slugInput.addEventListener('input', () => { isSlugManuallyEdited = true; }); nameInput.addEventListener('input', (e) => { if (!isSlugManuallyEdited) { const name = e.target.value; const slug = name .toLowerCase() .trim() .replace(/[^\w\s-]/g, '') .replace(/[\s_-]+/g, '-') .replace(/^-+|-+$/g, ''); slugInput.value = slug; } }); const mainContent = document.querySelector('main'); mainContent.style.opacity = '0'; mainContent.style.transform = 'translateY(10px)'; setTimeout(() => { mainContent.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out'; mainContent.style.opacity = '1'; mainContent.style.transform = 'translateY(0)'; }, 50); }); </script> </body></html>
