<!doctype html><html lang="en"><head><title>Workspaces - Messenger</title>{{template "messengerHead" .}}</head><body class="min-h-screen"><main class="max-w-3xl mx-auto p-6 pt-12"><div class="flex justify-between items-center mb-8"><div><h1 class="text-3xl font-bold">Workspaces</h1><p class="muted">Choose where you want to work.</p></div><div class="flex gap-3"><a href="/settings/profile" class="btn soft">Profile</a><a href="/logout" class="btn soft">Logout</a></div></div><div class="space-y-3">{{range .Workspaces}}<a class="card p-5 block hover:border-green-700" href="/workspaces/{{.ID}}"><div class="font-bold text-lg">{{.Name}}</div><div class="muted text-sm">{{.CompanyName}} · {{.Role}}</div></a>{{else}}<div class="card p-8 text-center muted">No workspaces available. Ask a company administrator to add you.</div>{{end}}</div></main></body></html>
