<!doctype html><html lang="en"><head><title>Edit company member - Messenger</title>{{template "messengerHead" .}}</head><body class="min-h-screen"><main class="max-w-xl mx-auto p-6 pt-10"><a class="text-green-800" href="/companies/{{.Company.ID}}/members">← Members</a><h1 class="text-3xl font-bold mt-2">{{.Member.Name}}</h1><p class="muted mb-6">@{{.Member.Username}} · {{.Member.Email}}</p><form action="/api/companies/{{.Company.ID}}/members/{{.Member.UserID}}" method="post" class="card p-6 space-y-4"><label class="block">Role<select class="input mt-1" name="role"><option {{if eq .Member.Role "MEMBER"}}selected{{end}}>MEMBER</option><option {{if eq .Member.Role "GUEST"}}selected{{end}}>GUEST</option>{{if eq .CompanyRole "OWNER"}}<option {{if eq .Member.Role "ADMIN"}}selected{{end}}>ADMIN</option><option {{if eq .Member.Role "OWNER"}}selected{{end}}>OWNER</option>{{end}}</select></label><button class="btn primary">Save</button></form><form class="mt-4" action="/api/companies/{{.Company.ID}}/members/{{.Member.UserID}}/remove" method="post"><button class="text-red-700 font-bold">Remove from company</button></form><p class="muted text-sm mt-2">The last company owner cannot be demoted or removed.</p></main></body></html>
