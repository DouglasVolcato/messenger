<!doctype html>
<html lang="en">
<head><title>Profile - Messenger</title>{{ template "messengerHead" . }}</head>
<body class="min-h-screen">
<main class="max-w-2xl mx-auto p-6 pt-10">
  <a class="text-green-800" href="{{ .BackURL }}">← Back</a><h1 class="text-3xl font-bold mt-2 mb-6">Profile</h1>
  {{ if .Success }}<div class="card p-3 mb-4 border-green-700">{{ .Success }}</div>{{ end }}{{ if .Error }}<div class="card p-3 mb-4 border-red-400 text-red-700">{{ .Error }}</div>{{ end }}
  <form action="/api/settings/profile" method="post" class="card p-6 space-y-4">
    <label class="block">Name<input class="input mt-1" name="name" value="{{ .User.Name }}" required /></label>
    <label class="block">Username<input class="input mt-1" name="username" value="{{ .User.Username }}" required /></label>
    <label class="block">Email<input class="input mt-1" type="email" name="email" value="{{ .User.Email }}" required /></label>
    <div class="flex justify-between"><a class="text-green-800" href="/settings/security">Security</a><button class="btn primary">Save changes</button></div>
  </form>
</main>
</body>
</html>
