<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cadastro - Messenger</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&amp;family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#e4e0d8",
                        "primary-fixed": "#c8e8d0",
                        "inverse-primary": "#8ecf9e",
                        "surface-container": "#f0ece4",
                        "error": "#b83230",
                        "surface-dim": "#dbd7cf",
                        "inverse-surface": "#2e3230",
                        "secondary-fixed-dim": "#d4ccbf",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#2a6038",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#dcc48e",
                        "tertiary-fixed": "#f8e0a8",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c4c8bc",
                        "inverse-on-surface": "#f5f0e8",
                        "surface-container-high": "#eae6de",
                        "on-secondary-fixed": "#1e1a13",
                        "background": "#faf6f0",
                        "on-secondary-container": "#5e5548",
                        "error-container": "#ffdad8",
                        "primary": "#4a7c59",
                        "outline": "#74796e",
                        "on-surface-variant": "#4a4e4a",
                        "surface-container-highest": "#e4e0d8",
                        "on-secondary-fixed-variant": "#4a4538",
                        "secondary-fixed": "#f0e8db",
                        "secondary-container": "#f0e8db",
                        "on-error": "#ffffff",
                        "on-surface": "#2e3230",
                        "on-tertiary-fixed-variant": "#554020",
                        "on-primary-fixed": "#002110",
                        "secondary": "#6b6358",
                        "on-primary-container": "#d8f0de",
                        "surface": "#faf6f0",
                        "primary-container": "#78a886",
                        "surface-container-low": "#f5f1ea",
                        "tertiary-container": "#c4a66a",
                        "tertiary": "#705c30",
                        "surface-tint": "#4a7c59",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#221a05",
                        "surface-bright": "#faf6f0",
                        "on-tertiary-container": "#554020",
                        "on-error-container": "#690005",
                        "primary-fixed-dim": "#8ecf9e",
                        "on-background": "#2e3230"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Literata", "serif"],
                        "display": ["Literata", "serif"],
                        "body": ["Nunito Sans", "sans-serif"],
                        "label": ["Nunito Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Nunito Sans', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-headline { font-family: 'Literata', serif; }
        
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
        }
        .material-symbols-outlined.filled {
          font-variation-settings:
          'FILL' 1;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4 selection:bg-primary-container selection:text-on-primary-container">
<!-- Design Note: TopNavBar and SideNav are suppressed for this transactional (Signup) flow to prioritize the form canvas, adhering to the "Semantic Shell" mandate. -->
<main class="w-full max-w-md">
<!-- Brand Header -->
<div class="text-center mb-10">
<h1 class="text-3xl font-headline font-bold text-primary flex items-center justify-center gap-2">
<span class="material-symbols-outlined filled text-4xl" data-icon="forum" data-weight="fill">forum</span>
                Messenger
            </h1>
<p class="text-on-surface-variant font-body mt-2 text-lg">Crie sua conta para começar</p>
</div>
<!-- Registration Form Card -->
<div class="bg-surface rounded-xl shadow-[0_4px_20px_rgba(46,50,48,0.06)] p-8">
<form action="#" class="space-y-6" method="POST">
<!-- Nome -->
<div>
<label class="block text-sm font-medium text-on-surface mb-2" for="name">Nome</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="person">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow duration-200" id="name" name="name" placeholder="Seu nome completo" required="" type="text"/>
</div>
</div>
<!-- Username -->
<div>
<label class="block text-sm font-medium text-on-surface mb-2" for="username">Username</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="alternate_email">alternate_email</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow duration-200" id="username" name="username" placeholder="seu_username" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="block text-sm font-medium text-on-surface mb-2" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow duration-200" id="email" name="email" placeholder="voce@exemplo.com" required="" type="email"/>
</div>
</div>
<!-- Senha -->
<div>
<label class="block text-sm font-medium text-on-surface mb-2" for="password">Senha</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Confirmar Senha -->
<div>
<label class="block text-sm font-medium text-on-surface mb-2" for="confirm_password">Confirmar senha</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="lock_reset">lock_reset</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow duration-200" id="confirm_password" name="confirm_password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-[12px] shadow-sm text-lg font-medium text-on-primary bg-primary hover:bg-primary-container hover:text-on-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200 font-label" type="submit">
                        Criar conta
                    </button>
</div>
</form>
<!-- Login Link -->
<div class="mt-8 text-center">
<p class="text-sm text-on-surface-variant font-body">
                    Já tem uma conta? 
                    <a class="font-medium text-primary hover:text-on-primary-container transition-colors duration-200" href="#">Faça login</a>
</p>
</div>
</div>
<!-- Decorative subtle element -->
<div class="mt-12 flex justify-center opacity-30 pointer-events-none">
<span class="material-symbols-outlined text-tertiary text-6xl" data-icon="eco">eco</span>
</div>
</main>
</body></html>
